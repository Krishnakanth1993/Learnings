<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridWorld Value Iteration - Real-time Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            animation: fadeIn 1s ease;
        }

        .grid-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .grid-cell::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 0%, rgba(255, 255, 255, 0.3) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .grid-cell:hover::before {
            opacity: 1;
        }

        .grid-cell.terminal {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            font-weight: bold;
        }

        .grid-cell.start {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-weight: bold;
        }

        .cell-label {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .cell-value {
            font-size: 1.3rem;
            font-weight: 600;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .cell-policy {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .grid-cell.show-policy .cell-label {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .grid-cell.show-policy .cell-value {
            font-size: 1.3rem;
            /* Keep same font size */
        }

        .grid-cell.show-policy .cell-policy {
            opacity: 1;
        }

        .policy-arrows {
            display: flex;
            gap: 3px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .arrow {
            font-size: 1.8rem;
            line-height: 1;
            font-weight: bold;
        }

        button.toggle-policy {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            width: 100%;
        }

        .stats-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            height: 250px;
        }

        canvas {
            max-width: 100%;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .updating {
            animation: pulse 0.5s ease;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-running {
            background: #38ef7d;
            box-shadow: 0 0 10px #38ef7d;
        }

        .status-stopped {
            background: #f5576c;
        }

        .status-converged {
            background: #ffd700;
            box-shadow: 0 0 10px #ffd700;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 GridWorld Value Iteration</h1>
            <p class="subtitle">Real-time Bellman Equation Visualization</p>
        </header>

        <div class="main-content">
            <div class="grid-section">
                <h2>4×4 GridWorld</h2>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);"></div>
                        <span>Start (S0)</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);"></div>
                        <span>Terminal (S15)</span>
                    </div>
                </div>
                <div class="grid-container" id="gridContainer"></div>
                
                <div class="chart-container">
                    <canvas id="convergenceChart"></canvas>
                </div>
            </div>

            <div class="stats-panel">
                <h2>Statistics</h2>
                
                <div class="stat-card">
                    <div class="stat-label">
                        <span class="status-indicator" id="statusIndicator"></span>
                        Status
                    </div>
                    <div class="stat-value" id="statusValue">Initializing...</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Iteration</div>
                    <div class="stat-value" id="iterationValue">0</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressBar"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Delta (Max Change)</div>
                    <div class="stat-value" id="deltaValue">0.0000</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Convergence Threshold</div>
                    <div class="stat-value">1e-4</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Discount Factor (γ)</div>
                    <div class="stat-value">1.0</div>
                </div>

                <div class="controls">
                    <button id="startBtn" onclick="startVisualization()">▶ Start</button>
                    <button id="pauseBtn" onclick="pauseVisualization()" disabled>⏸ Pause</button>
                    <button id="resetBtn" onclick="resetVisualization()">🔄 Reset</button>
                    <button id="stepBtn" onclick="stepVisualization()">⏭ Step</button>
                    <button class="toggle-policy" id="togglePolicyBtn" onclick="togglePolicy()" disabled>🎯 Show Policy</button>
                    <input type="file" id="jsonFileInput" accept=".json" style="display: none;" onchange="handleFileSelect(event)">
                    <button id="loadBtn" onclick="document.getElementById('jsonFileInput').click()" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">📁 Load Data</button>
                </div>

                <div class="stat-card" style="margin-top: 20px;">
                    <div class="stat-label">Speed Control</div>
                    <input type="range" id="speedSlider" min="10" max="500" value="100" style="width: 100%;">
                    <div style="text-align: center; margin-top: 5px;">
                        <span id="speedValue">100ms</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let gridData = null;
        let currentIteration = 0;
        let isPlaying = false;
        let animationInterval = null;
        let chart = null;
        let deltaHistory = [];
        let showingPolicy = false;

        // Action symbols for policy display
        const actionSymbols = {
            'up': '↑',
            'down': '↓',
            'left': '←',
            'right': '→'
        };

        // Initialize grid
        function initializeGrid() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.id = `cell-${i}`;
                
                if (i === 0) {
                    cell.classList.add('start');
                }
                if (i === 15) {
                    cell.classList.add('terminal');
                }
                
                cell.innerHTML = `
                    <div class="cell-label">S${i}</div>
                    <div class="cell-value">0.000</div>
                    <div class="cell-policy"></div>
                `;
                
                container.appendChild(cell);
            }
        }

        // Update grid with values
        function updateGrid(values) {
            for (let i = 0; i < 16; i++) {
                const cell = document.getElementById(`cell-${i}`);
                const valueElement = cell.querySelector('.cell-value');
                valueElement.textContent = values[i].toFixed(3);
                
                // Add animation
                cell.classList.add('updating');
                setTimeout(() => cell.classList.remove('updating'), 300);
                
                // Color based on value (gradient from red to green)
                if (i !== 0 && i !== 15) {
                    const normalized = (values[i] + 20) / 20; // Normalize to 0-1
                    const hue = normalized * 120; // 0 (red) to 120 (green)
                    cell.style.background = `hsl(${hue}, 70%, 85%)`;
                    cell.style.color = '#333';
                }
            }
        }

        // Display policy arrows on grid
        function displayPolicy() {
            if (!gridData || !gridData.final_policy) {
                alert('Policy data not available. Please run the Python script first!');
                return;
            }

            for (let i = 0; i < 16; i++) {
                const cell = document.getElementById(`cell-${i}`);
                const policyElement = cell.querySelector('.cell-policy');
                
                if (i === 15) {
                    // Terminal state
                    policyElement.innerHTML = '<div class="policy-arrows">🎯</div>';
                } else {
                    const statePolicy = gridData.final_policy[i.toString()];
                    const arrows = [];
                    
                    // Get actions with non-zero probability
                    for (const [action, prob] of Object.entries(statePolicy)) {
                        if (prob > 0) {
                            arrows.push(actionSymbols[action]);
                        }
                    }
                    
                    const arrowsHtml = arrows.map(arrow => 
                        `<span class="arrow">${arrow}</span>`
                    ).join('');
                    
                    policyElement.innerHTML = `<div class="policy-arrows">${arrowsHtml}</div>`;
                }
            }
        }

        // Toggle policy visualization
        function togglePolicy() {
            showingPolicy = !showingPolicy;
            const cells = document.querySelectorAll('.grid-cell');
            const btn = document.getElementById('togglePolicyBtn');
            
            cells.forEach(cell => {
                if (showingPolicy) {
                    cell.classList.add('show-policy');
                } else {
                    cell.classList.remove('show-policy');
                }
            });
            
            btn.textContent = showingPolicy ? '📊 Show Values' : '🎯 Show Policy';
        }

        // Load data from JSON
        async function loadData() {
            try {
                const response = await fetch('gridworld_history.json');
                if (!response.ok) throw new Error('Fetch failed');
                gridData = await response.json();
                processLoadedData();
                return true;
            } catch (error) {
                console.warn('Auto-load failed (likely CORS). Please use the "Load Data" button.', error);
                updateStatus('Click "Load Data" to select gridworld_history.json', 'stopped');
                return false;
            }
        }

        // Handle manual file selection
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    gridData = JSON.parse(e.target.result);
                    processLoadedData();
                    updateStatus('Data Loaded Successfully', 'stopped');
                } catch (err) {
                    console.error('Error parsing JSON:', err);
                    alert('Invalid JSON file!');
                }
            };
            reader.readAsText(file);
        }

        // Process data after loading (either auto or manual)
        function processLoadedData() {
            console.log('Data processed:', gridData);
            
            // Display policy if available
            if (gridData.final_policy) {
                displayPolicy();
                document.getElementById('togglePolicyBtn').disabled = false;
            }
            
            updateStatus('Ready', 'stopped');
            
            // Reset visualization state
            resetVisualization();
        }

        // Update status
        function updateStatus(text, status) {
            document.getElementById('statusValue').textContent = text;
            const indicator = document.getElementById('statusIndicator');
            indicator.className = 'status-indicator';
            
            if (status === 'running') {
                indicator.classList.add('status-running');
            } else if (status === 'converged') {
                indicator.classList.add('status-converged');
            } else {
                indicator.classList.add('status-stopped');
            }
        }

        // Start visualization
        function startVisualization() {
            if (!gridData) {
                alert('Please run the Python script first to generate data!');
                return;
            }
            
            isPlaying = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            updateStatus('Running', 'running');
            
            const speed = parseInt(document.getElementById('speedSlider').value);
            animationInterval = setInterval(stepVisualization, speed);
        }

        // Pause visualization
        function pauseVisualization() {
            isPlaying = false;
            clearInterval(animationInterval);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            updateStatus('Paused', 'stopped');
        }

        // Reset visualization
        function resetVisualization() {
            pauseVisualization();
            currentIteration = 0;
            deltaHistory = [];
            showingPolicy = false;
            
            initializeGrid();
            
            // Restore policy arrows if data available
            if (gridData && gridData.final_policy) {
                displayPolicy();
            }
            
            updateStats(0, 0);
            updateChart();
            updateStatus('Ready', 'stopped');
            
            document.getElementById('togglePolicyBtn').textContent = '🎯 Show Policy';
        }

        // Step through visualization
        function stepVisualization() {
            if (!gridData || currentIteration >= gridData.history.length) {
                if (isPlaying) {
                    pauseVisualization();
                    updateStatus('Converged!', 'converged');
                }
                return;
            }
            
            const data = gridData.history[currentIteration];
            updateGrid(data.V);
            updateStats(data.iteration, data.delta);
            
            deltaHistory.push(data.delta);
            updateChart();
            
            currentIteration++;
            
            // Update progress
            const progress = (currentIteration / gridData.history.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
        }

        // Update statistics
        function updateStats(iteration, delta) {
            document.getElementById('iterationValue').textContent = iteration;
            document.getElementById('deltaValue').textContent = delta.toFixed(6);
        }

        // Initialize chart
        function initializeChart() {
            const ctx = document.getElementById('convergenceChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Delta (Convergence)',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Delta'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Iteration'
                            }
                        }
                    }
                }
            });
        }

        // Update chart
        function updateChart() {
            if (!chart) return;
            
            chart.data.labels = deltaHistory.map((_, i) => i);
            chart.data.datasets[0].data = deltaHistory;
            chart.update('none'); // Update without animation for performance
        }

        // Speed slider
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            const speed = e.target.value;
            document.getElementById('speedValue').textContent = `${speed}ms`;
            
            if (isPlaying) {
                clearInterval(animationInterval);
                animationInterval = setInterval(stepVisualization, parseInt(speed));
            }
        });

        // Initialize on load
        window.addEventListener('load', async () => {
            initializeGrid();
            await loadData();
        });
    </script>
    
    <!-- Chart.js library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</body>
</html>
